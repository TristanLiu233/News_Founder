# Optional local PostgreSQL in Docker (pgvector/pgvector:pg16 on 127.0.0.1:5432).
# Since Local-1 (2026-09-30) the local runtime is native PostgreSQL 16 on 127.0.0.1:5433 and daily
# local operation does not need Docker Desktop; this file stays as an alternative local database and
# as the rollback path (README "Local runtime"). Production uses deploy/docker-compose.production.yml.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industry_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-industry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Published on the loopback interface only; never expose PostgreSQL to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
