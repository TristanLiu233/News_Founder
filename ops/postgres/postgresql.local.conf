# Local-1: settings appended to the native cluster's postgresql.conf (see README "Local runtime").
# Loopback and Unix socket only; never listen on a LAN or public interface.
listen_addresses = 'localhost'
port = 5433                        # 5432 stays free for the optional Docker database
unix_socket_directories = '/tmp'
timezone = 'Etc/UTC'               # same server time zone as the Docker/production image
log_timezone = 'Australia/Sydney'
password_encryption = scram-sha-256
